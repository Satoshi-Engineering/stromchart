  script:
    - apk add jq git
    - |
      VERSION=$(jq -r '.version' package.json)
      SHORT_HASH=$(git rev-parse --short HEAD)
      if [ -z "$CI_COMMIT_TAG" ]; then
        VERSION="${VERSION}.${SHORT_HASH}"
        jq '.meta["version-detailed"] = "${VERSION}"' package.json > package.tmp.json && mv package.tmp.json package.json
      fi
    - docker build --build-arg VERSION=$VERSION -f frontend.Dockerfile -t stromchart-frontend:$VERSION .
    - echo Logging in to $DOCKER_REGISTRY_HOST
    - echo $DOCKER_REGISTRY_PASSWORD | docker login --username $DOCKER_REGISTRY_USER --password-stdin $DOCKER_REGISTRY_HOST
    - docker tag stromchart-frontend:$VERSION $DOCKER_REGISTRY_HOST/stromchart-frontend:$VERSION
