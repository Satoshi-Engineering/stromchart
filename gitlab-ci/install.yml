install:
  stage: .pre # always first, no matter if it is listed in stages
  rules:
    - changes:
      - backend/package-lock.json
      - frontend/package-lock.json
      - package-lock.json
  cache:
    - !reference [.shared_config, cache, npm]
    - key:
        files:
          - package-lock.json
        prefix: node_modules
      paths:
        - backend/node_modules/
        - frontend/node_modules/
        - node_modules/
      when: on_success
      policy: pull-push
  script:
    - if ! [[ -d backend/node_modules ]]; then cd backend && npm ci --cache .npm --prefer-offline && cd ..; fi
    - if ! [[ -d frontend/node_modules ]]; then cd frontend && npm ci --cache .npm --prefer-offline && cd ..; fi
    - if ! [[ -d node_modules ]]; then npm ci --cache .npm --prefer-offline; fi
